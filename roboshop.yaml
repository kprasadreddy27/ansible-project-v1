- name: create instances and route 53 records
  hosts: local
  connection: local
  vars:
    instances: ['mongodb', 'redis', 'mysql', 'rabbitmq']
    domain: kpraws.shop
    action_name: create
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups:
      - myip
      - "roboshop-{{ item }}"
      region: us-east-1
    loop: "{{ instances }}"
    when: action_name == "create"
    register: ec2_output
    
  # - name: print ec2 output
  #   debug:
  #     msg: "{{ec2_output}}"
    
  - name: create route 53 records
    amazon.aws.route53:
      state: present
      zone: "{{domain}}"
      record: "{{item.item}}.{{domain}}"
      type: A
      ttl: 1
      value: "{{item.instances[0].private_ip_address}}"
      overwrite: true
    loop: "{{ec2_output.results}}"
    when: action == "create"