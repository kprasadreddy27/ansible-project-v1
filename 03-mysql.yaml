- name: install mysql
  hosts: mysql
  become: yes
  tasks:
  - name: enable mysql 8.4
    command: dnf module enable mysql:8.4 -y

  # - name: test inventory variable
  #   debug:
  #     msg: "{{app_name}}"

  - name: install mysql
    package:
      name: mysql-server
      state: present

  - name: enable and start
    service:
      name: mysqld
      state: started
      enabled: yes

  - name: restart
    command: mysql_secure_installation --set-root-pass "{{mysql_root_password}}"

      
