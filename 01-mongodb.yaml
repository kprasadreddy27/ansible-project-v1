- name: install mongodb
  hosts: mongodb
  become: yes
  tasks:
  - name: copy repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  # - name: test inventory variable
  #   debug:
  #     msg: "{{app_name}}"

  - name: install mongodb
    package:
      name: mongodb-org
      state: present

  - name: enable and start
    service:
      name: mongod
      state: started
      enabled: yes

  - name: allow remote connections
    replace:
      path: /etc/mongod.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'
